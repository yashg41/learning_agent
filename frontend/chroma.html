<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyMentor — Memory Explorer</title>
    <link rel="stylesheet" href="/static/tokens.css">
    <link rel="stylesheet" href="/api/palette.css">
    <script>
        // Applied before first paint so the page never flashes the wrong theme.
        (function () {
            var forced = new URLSearchParams(location.search).get('theme');
            var saved = null;
            try { saved = localStorage.getItem('pymentor:theme'); } catch (e) {}
            var prefersLight = matchMedia('(prefers-color-scheme: light)').matches;
            var t = (forced === 'light' || forced === 'dark') ? forced
                  : saved || (prefersLight ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }


        body {
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            background: var(--bg-primary);
            color: var(--text-bright);
            min-height: 100vh;
        }

        /* Top Bar */
        /* .topbar / .topnav / .brand come from tokens.css so all three
           pages share one header. Only the local button style lives here. */
        .btn-ghost {
            padding: 5px 10px;
            font-family: inherit;
            font-size: var(--text-xs);
            font-weight: 600;
            color: var(--text-dim);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: color var(--duration-fast) var(--ease),
                        border-color var(--duration-fast) var(--ease);
        }
        .btn-ghost:hover { color: var(--accent); border-color: var(--accent); }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 24px;
            padding: 14px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-strong);
        }

        .stat-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .stat-chip .label { color: var(--text-muted); }
        .stat-chip .value { color: var(--text-bright); font-weight: 700; }
        .stat-chip .value.accent { color: var(--accent); }

        /* Main Layout */
        .main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr;
            gap: 0;
            height: calc(100vh - var(--header-height) - 52px);
        }

        /* Search Panel (spans full width) */
        .search-panel {
            grid-column: 1 / -1;
            padding: 14px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-strong);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-panel input {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-bright);
            font-family: inherit;
            font-size: 13px;
        }

        .search-panel input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .search-panel button {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .search-panel button:hover { background: var(--accent-hover); }

        .search-panel select {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            padding: 8px 10px;
            color: var(--text-bright);
            font-family: inherit;
            font-size: 12px;
        }

        /* Left: Scatter Plot */
        .scatter-panel {
            border-right: 1px solid var(--border-strong);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-strong);
            background: var(--bg-secondary);
        }

        .scatter-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        canvas#scatter-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .scatter-empty {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            background: var(--bg-secondary);
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 11px;
            max-width: 320px;
            pointer-events: none;
            z-index: 100;
            display: none;
            box-shadow: var(--shadow-md);
        }

        .tooltip .tt-doc {
            color: var(--text-dim);
            line-height: 1.4;
            margin-bottom: 4px;
        }

        .tooltip .tt-meta {
            color: var(--text-muted);
            font-size: 10px;
        }

        .tooltip .tt-topics {
            margin-top: 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }

        .tooltip .tt-tag {
            font-size: 9px;
            background: var(--accent-soft);
            color: var(--accent);
            padding: 1px 5px;
            border-radius: 2px;
        }

        /* Right: Document List */
        .docs-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .docs-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .doc-card {
            background: var(--bg-tertiary);
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .doc-card:hover {
            border-color: var(--accent);
        }

        .doc-card.active {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .doc-card.search-result {
            border-left: 3px solid var(--success);
        }

        .doc-id {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .doc-text {
            font-size: 12px;
            color: var(--text-dim);
            line-height: 1.5;
            margin-bottom: 6px;
        }

        /* Retrieval -> resumption: find an exchange in memory, then land in
           that conversation and continue it. */
        .doc-open {
            margin-left: auto;
            font-size: var(--text-2xs);
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
            white-space: nowrap;
        }
        .doc-open:hover { text-decoration: underline; }

        .doc-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }

        .doc-email {
            font-size: 10px;
            color: var(--accent-hover);
        }

        .doc-time {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
        }

        .doc-similarity {
            font-size: 10px;
            font-weight: 700;
            color: var(--success);
            margin-left: auto;
        }

        .doc-topics {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            margin-top: 6px;
        }

        .doc-tag {
            font-size: 10px;
            background: var(--accent-soft);
            color: var(--accent);
            padding: 2px 6px;
            border-radius: 3px;
        }

        .docs-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Collection Toggle */
        .collection-toggle {
            display: flex;
            gap: 0;
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            overflow: hidden;
        }

        .collection-toggle button {
            background: var(--bg-tertiary);
            color: var(--text-muted);
            border: none;
            padding: 6px 14px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .collection-toggle button:not(:last-child) {
            border-right: 1px solid var(--border-strong);
        }

        .collection-toggle button.active {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .collection-toggle button:hover:not(.active) {
            color: var(--text-bright);
        }

        /* Exchange card styles */
        .doc-card.exchange-card {
            border-left: 2px solid var(--accent);
        }

        .doc-user-msg {
            font-size: 11px;
            color: var(--accent-hover);
            margin-bottom: 4px;
            font-style: italic;
        }

        .doc-raw-toggle {
            font-size: 10px;
            color: var(--accent);
            cursor: pointer;
            margin-top: 6px;
            user-select: none;
        }

        .doc-raw-toggle:hover { text-decoration: underline; }

        .doc-raw-exchange {
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.5;
            margin-top: 6px;
            padding: 8px;
            background: var(--bg-primary);
            border-radius: 4px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            display: none;
        }

        .doc-raw-exchange.visible { display: block; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 13px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        .loading-dot {
            animation: pulse 1.2s infinite;
        }
    </style>
</head>
<body>
    <!-- Same top bar as the chat and graph pages. -->
    <div class="topbar">
        <div class="brand"><span class="brand-mark">P</span> PyMentor</div>
        <nav class="topnav">
            <a href="/" class="topnav-link">Chat</a>
            <a href="/graph" class="topnav-link">Knowledge Graph</a>
            <a href="/chroma" class="topnav-link active">Memory</a>
        </nav>
        <div class="topbar-right">
            <button class="btn-ghost" id="theme-btn" onclick="toggleTheme()">◐ Light</button>
        </div>
    </div>

    <div class="stats-bar" id="stats-bar">
        <div class="collection-toggle">
            <button class="active" onclick="switchCollection('conversations')">Summaries</button>
            <button onclick="switchCollection('exchanges')">Exchanges</button>
        </div>
        <div class="stat-chip"><span class="label">Summaries:</span> <span class="value accent" id="stat-summaries">--</span></div>
        <div class="stat-chip"><span class="label">Exchanges:</span> <span class="value accent" id="stat-exchanges">--</span></div>
        <div class="stat-chip"><span class="label">Model:</span> <span class="value" id="stat-model">--</span></div>
        <div class="stat-chip"><span class="label">Distance:</span> <span class="value" id="stat-distance">--</span></div>
    </div>

    <div class="main">
        <div class="search-panel">
            <input type="text" id="search-input" placeholder="Semantic search across all episodes..." />
            <select id="email-filter">
                <option value="">All users</option>
            </select>
            <button onclick="doSearch()">Search</button>
            <button onclick="clearSearch()" style="background: var(--bg-tertiary); color: var(--text-dim);">Clear</button>
        </div>

        <div class="scatter-panel">
            <div class="panel-header">Embedding Space (PCA 2D Projection)</div>
            <div class="scatter-container">
                <canvas id="scatter-canvas"></canvas>
                <div class="scatter-empty" id="scatter-empty">Loading embeddings...</div>
                <div class="tooltip" id="tooltip"></div>
            </div>
        </div>

        <div class="docs-panel">
            <div class="panel-header">Documents <span id="docs-count" style="font-weight:400; color: var(--text-muted);"></span></div>
            <div class="docs-list" id="docs-list">
                <div class="loading"><span class="loading-dot">Loading documents...</span></div>
            </div>
        </div>
    </div>

    <script>
        const API = "";
        let allDocs = [];
        let allPoints = [];
        let highlightedIdx = -1;
        let searchResults = null;
        let currentCollection = "conversations"; // "conversations" or "exchanges"

        // ===== Collection Toggle =====

        function switchCollection(col) {
            currentCollection = col;
            // Update toggle buttons
            document.querySelectorAll(".collection-toggle button").forEach(btn => {
                btn.classList.toggle("active",
                    (col === "conversations" && btn.textContent === "Summaries") ||
                    (col === "exchanges" && btn.textContent === "Exchanges")
                );
            });
            // Update search placeholder
            document.getElementById("search-input").placeholder = col === "exchanges"
                ? "Semantic search across all exchanges..."
                : "Semantic search across all summaries...";
            clearSearch();
            loadDocuments();
        }

        // ===== Data Loading =====

        async function loadStats() {
            try {
                const res = await fetch(`${API}/api/chroma/stats`);
                const data = await res.json();
                const cols = data.collections || {};
                document.getElementById("stat-summaries").textContent = cols.conversations?.total_documents ?? 0;
                document.getElementById("stat-exchanges").textContent = cols.conversation_exchanges?.total_documents ?? 0;
                document.getElementById("stat-model").textContent = data.embedding_model;
                document.getElementById("stat-distance").textContent = data.distance_metric;
            } catch (e) {
                console.error("Failed to load stats:", e);
            }
        }

        async function loadDocuments() {
            try {
                document.getElementById("docs-list").innerHTML = '<div class="loading"><span class="loading-dot">Loading documents...</span></div>';
                const res = await fetch(`${API}/api/chroma/documents?collection=${currentCollection}`);
                const data = await res.json();
                allDocs = data.documents || [];
                allPoints = data.points_2d || [];

                // Populate email filter
                const emails = [...new Set(allDocs.map(d => d.email).filter(Boolean))];
                const select = document.getElementById("email-filter");
                // Clear existing options except "All users"
                select.innerHTML = '<option value="">All users</option>';
                for (const email of emails) {
                    const opt = document.createElement("option");
                    opt.value = email;
                    opt.textContent = email;
                    select.appendChild(opt);
                }

                renderDocs(allDocs);
                renderScatter();
            } catch (e) {
                console.error("Failed to load documents:", e);
                document.getElementById("docs-list").innerHTML = '<div class="docs-empty">Failed to load documents</div>';
            }
        }

        // ===== Search =====

        async function doSearch() {
            const query = document.getElementById("search-input").value.trim();
            if (!query) return;

            const email = document.getElementById("email-filter").value;
            const body = { query };
            if (email) body.email = email;

            try {
                const res = await fetch(`${API}/api/chroma/search`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                });
                const data = await res.json();
                searchResults = data.results || [];
                renderDocs(searchResults.map((r, i) => ({
                    ...r,
                    id: `result-${i}`,
                    _similarity: r.similarity,
                })));

                // Highlight matching docs in scatter
                highlightedIdx = -1;
                renderScatter();
            } catch (e) {
                console.error("Search failed:", e);
            }
        }

        function clearSearch() {
            document.getElementById("search-input").value = "";
            searchResults = null;
            renderDocs(allDocs);
            highlightedIdx = -1;
            renderScatter();
        }

        document.getElementById("search-input").addEventListener("keydown", (e) => {
            if (e.key === "Enter") doSearch();
        });

        // ===== Document List Rendering =====

        function cssVar(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        // Canvas does not restyle when custom properties change, so a theme
        // switch has to repaint the scatter explicitly.
        function applyTheme(t, persist = true) {
            document.documentElement.setAttribute("data-theme", t);
            const btn = document.getElementById("theme-btn");
            if (btn) btn.textContent = t === "light" ? "\u25d1 Dark" : "\u25d0 Light";
            if (persist) {
                try { localStorage.setItem("pymentor:theme", t); } catch (e) {}
            }
            if (typeof renderScatter === "function") renderScatter();
        }
        function toggleTheme() {
            const cur = document.documentElement.getAttribute("data-theme") || "dark";
            applyTheme(cur === "dark" ? "light" : "dark");
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        function renderDocs(docs) {
            const container = document.getElementById("docs-list");
            document.getElementById("docs-count").textContent = `(${docs.length})`;

            if (docs.length === 0) {
                container.innerHTML = '<div class="docs-empty">No documents found. Start chatting to build episodic memory!</div>';
                return;
            }

            let html = "";
            for (let i = 0; i < docs.length; i++) {
                const d = docs[i];
                const ts = d.timestamp ? d.timestamp.substring(0, 19).replace("T", " ") : "";
                const isSearch = d._similarity !== undefined;
                const isExchange = d.raw_exchange !== undefined;

                html += `
                    <div class="doc-card${isSearch ? " search-result" : ""}${isExchange ? " exchange-card" : ""}" data-idx="${i}"
                         onmouseenter="highlightPoint(${i})" onmouseleave="unhighlightPoint()">
                        <div class="doc-id">${escapeHtml(d.id || "")}</div>`;

                if (isExchange && d.user_message) {
                    html += `<div class="doc-user-msg">User: ${escapeHtml(d.user_message)}</div>`;
                }

                html += `<div class="doc-text">${escapeHtml(d.document)}</div>
                        <div class="doc-meta">
                            <span class="doc-email">${escapeHtml(d.email || "")}</span>
                            <span class="doc-time">${escapeHtml(ts)}</span>
                            ${isExchange ? `<span class="doc-time">#${d.exchange_index || 0}</span>` : ""}
                            ${isSearch ? `<span class="doc-similarity">${(d._similarity * 100).toFixed(1)}% match</span>` : ""}
                            ${d.session_id ? `
                                <a class="doc-open" title="Open this conversation and keep going"
                                   href="/?session=${encodeURIComponent(d.session_id)}&email=${encodeURIComponent((d.email || "").toLowerCase())}"
                                   onclick="event.stopPropagation()">open session →</a>` : ""}
                        </div>`;

                if (d.topics && d.topics.length) {
                    html += `<div class="doc-topics">
                                ${d.topics.map(t => `<span class="doc-tag">${escapeHtml(t)}</span>`).join("")}
                             </div>`;
                }

                if (isExchange && d.raw_exchange) {
                    html += `<div class="doc-raw-toggle" onclick="toggleRawExchange(this)">Show full exchange</div>
                             <div class="doc-raw-exchange">${escapeHtml(d.raw_exchange)}</div>`;
                }

                html += `</div>`;
            }
            container.innerHTML = html;
        }

        function toggleRawExchange(el) {
            const raw = el.nextElementSibling;
            const visible = raw.classList.toggle("visible");
            el.textContent = visible ? "Hide full exchange" : "Show full exchange";
        }

        // ===== Scatter Plot =====

        function renderScatter() {
            const canvas = document.getElementById("scatter-canvas");
            const container = canvas.parentElement;
            const emptyEl = document.getElementById("scatter-empty");

            if (allPoints.length === 0) {
                emptyEl.textContent = allDocs.length === 0
                    ? "No embeddings yet. Start chatting to populate the vector store!"
                    : "Need at least 2 documents for 2D projection.";
                emptyEl.style.display = "flex";
                return;
            }

            emptyEl.style.display = "none";

            // Size canvas for retina
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            canvas.style.width = rect.width + "px";
            canvas.style.height = rect.height + "px";

            const ctx = canvas.getContext("2d");
            ctx.scale(dpr, dpr);

            const W = rect.width;
            const H = rect.height;
            const pad = 40;

            // Clear
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--bg-primary").trim();
            ctx.fillRect(0, 0, W, H);

            // Grid
            ctx.strokeStyle = cssVar("--canvas-grid");
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 4; i++) {
                const x = pad + (W - 2 * pad) * i / 4;
                const y = pad + (H - 2 * pad) * i / 4;
                ctx.beginPath(); ctx.moveTo(x, pad); ctx.lineTo(x, H - pad); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke();
            }

            // Axes labels
            ctx.fillStyle = cssVar("--text-muted");
            ctx.font = "10px monospace";
            ctx.textAlign = "center";
            ctx.fillText("PC1", W / 2, H - 8);
            ctx.save();
            ctx.translate(12, H / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText("PC2", 0, 0);
            ctx.restore();

            // Map points to canvas coords
            function toCanvas(pt) {
                return {
                    cx: pad + (pt.x + 1) / 2 * (W - 2 * pad),
                    cy: pad + (1 - (pt.y + 1) / 2) * (H - 2 * pad),
                };
            }

            // Assign colors by email
            const emails = [...new Set(allDocs.map(d => d.email))];
            const palette = ["python", "ops", "ml", "sysdesign", "llm", "dl", "quantum"]
                    .map(t => cssVar("--track-" + t));

            // Draw points
            for (let i = 0; i < allPoints.length; i++) {
                const pt = toCanvas(allPoints[i]);
                const emailIdx = emails.indexOf(allDocs[i]?.email || "");
                const color = palette[emailIdx % palette.length] || palette[0];

                const isHighlighted = i === highlightedIdx;
                const radius = isHighlighted ? 8 : 5;

                // Glow for highlighted
                if (isHighlighted) {
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 12;
                }

                ctx.beginPath();
                ctx.arc(pt.cx, pt.cy, radius, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();

                if (isHighlighted) {
                    ctx.strokeStyle = cssVar("--text-bright");
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            }

            // Legend
            if (emails.length > 0) {
                const legendX = W - pad - 10;
                let legendY = pad + 10;
                ctx.textAlign = "right";
                ctx.font = "10px monospace";
                for (let i = 0; i < emails.length; i++) {
                    const color = palette[i % palette.length];
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.arc(legendX - 4, legendY - 3, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = cssVar("--text-dim");
                    ctx.fillText(emails[i], legendX - 14, legendY);
                    legendY += 16;
                }
            }
        }

        // Hover interactions
        function highlightPoint(idx) {
            if (searchResults) return; // Don't highlight during search
            highlightedIdx = idx;
            renderScatter();
            showTooltipForDoc(idx);
        }

        function unhighlightPoint() {
            highlightedIdx = -1;
            renderScatter();
            document.getElementById("tooltip").style.display = "none";
        }

        function showTooltipForDoc(idx) {
            if (idx >= allPoints.length) return;
            const doc = allDocs[idx];
            if (!doc) return;

            const canvas = document.getElementById("scatter-canvas");
            const rect = canvas.parentElement.getBoundingClientRect();
            const pad = 40;
            const pt = allPoints[idx];
            const cx = pad + (pt.x + 1) / 2 * (rect.width - 2 * pad);
            const cy = pad + (1 - (pt.y + 1) / 2) * (rect.height - 2 * pad);

            const tooltip = document.getElementById("tooltip");
            const ts = doc.timestamp ? doc.timestamp.substring(0, 19).replace("T", " ") : "";
            const topicsHtml = doc.topics && doc.topics.length
                ? `<div class="tt-topics">${doc.topics.map(t => `<span class="tt-tag">${escapeHtml(t)}</span>`).join("")}</div>`
                : "";

            tooltip.innerHTML = `
                <div class="tt-doc">${escapeHtml(doc.document.substring(0, 200))}${doc.document.length > 200 ? "..." : ""}</div>
                <div class="tt-meta">${escapeHtml(doc.email)} &middot; ${escapeHtml(ts)}</div>
                ${topicsHtml}
            `;

            // Position tooltip
            let left = cx + 16;
            let top = cy - 10;
            if (left + 330 > rect.width) left = cx - 330;
            if (top + 120 > rect.height) top = cy - 100;

            tooltip.style.left = left + "px";
            tooltip.style.top = top + "px";
            tooltip.style.display = "block";
        }

        // Canvas mouse move for hover detection
        document.getElementById("scatter-canvas").addEventListener("mousemove", (e) => {
            if (allPoints.length === 0) return;
            const canvas = e.target;
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const pad = 40;

            let closest = -1;
            let closestDist = Infinity;

            for (let i = 0; i < allPoints.length; i++) {
                const pt = allPoints[i];
                const cx = pad + (pt.x + 1) / 2 * (rect.width - 2 * pad);
                const cy = pad + (1 - (pt.y + 1) / 2) * (rect.height - 2 * pad);
                const dist = Math.hypot(mx - cx, my - cy);
                if (dist < closestDist && dist < 20) {
                    closest = i;
                    closestDist = dist;
                }
            }

            if (closest !== highlightedIdx) {
                highlightedIdx = closest;
                renderScatter();
                if (closest >= 0) {
                    showTooltipForDoc(closest);
                    // Highlight corresponding doc card
                    document.querySelectorAll(".doc-card").forEach(c => c.classList.remove("active"));
                    const card = document.querySelector(`.doc-card[data-idx="${closest}"]`);
                    if (card) {
                        card.classList.add("active");
                        card.scrollIntoView({ block: "nearest", behavior: "smooth" });
                    }
                } else {
                    document.getElementById("tooltip").style.display = "none";
                    document.querySelectorAll(".doc-card").forEach(c => c.classList.remove("active"));
                }
            }
        });

        document.getElementById("scatter-canvas").addEventListener("mouseleave", () => {
            highlightedIdx = -1;
            renderScatter();
            document.getElementById("tooltip").style.display = "none";
            document.querySelectorAll(".doc-card").forEach(c => c.classList.remove("active"));
        });

        // Handle resize
        window.addEventListener("resize", () => renderScatter());

        // ===== Init =====
        // Sync the button label only — persisting here would harden an OS
        // preference into an explicit saved choice.
        applyTheme(document.documentElement.getAttribute("data-theme") || "dark", false);
        loadStats();
        loadDocuments();
    </script>
</body>
</html>
